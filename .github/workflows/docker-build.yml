name: Docker Build

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.DOCKER_REGISTRY }} # TODO: set to your registry hostname, e.g. ghcr.io/your-org
      IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }} # TODO: set to your image repository name, e.g. pwchat-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make libssl-dev nlohmann-json3-dev \
            ca-certificates git

      - name: Build native server artifact
        run: |
          mkdir -p build
          cmake -S . -B build
          cmake --build build --target PWChat -- -j$(nproc)

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: pwchat-server:latest

      - name: Publish Docker image
        if: env.REGISTRY != '' && env.IMAGE_NAME != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
